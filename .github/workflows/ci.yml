name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  styles:
    name: CSS compilado al día con Elastic ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ['1.7.5']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check -- --download
      - name: meta.json válido y hereda de Elastic
        run: node -e "const m=require('./meta.json'); if(m.extends!=='elastic') process.exit(1)"
